name: devcontainer-check
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build devcontainer and verify install + dashboard
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            cd naver_blog_bot
            python3 -c "import fastapi, playwright, PIL, bs4; print('python deps ok')"
            claude --version
            ls "$PLAYWRIGHT_BROWSERS_PATH" | grep -i chromium
            fc-list | grep -i -E "noto.*cjk|nanum" | head -1
            bash start_dashboard_codespace.sh
            for i in $(seq 1 15); do sleep 2; curl -sS -m 3 http://127.0.0.1:8787/api/status && break; done
            curl -sS http://127.0.0.1:8787/api/status | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['cloud'] is True, d; print('dashboard ok, cloud mode')"
            curl -sS http://127.0.0.1:8787/api/posts | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d)>=1, d; print('posts:', [p['title'][:30] for p in d])"
            curl -sS -o /dev/null -w "index %{http_code}\n" http://127.0.0.1:8787/
